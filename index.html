<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sriti Jha</title><style>:root{--b:#101010;--c:#e8e4d8;--l:#c9f65b;--g:#393934}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--c);font:16px Arial}.p{min-height:100vh;padding:24px max(22px,7vw);display:flex;flex-direction:column;background:radial-gradient(circle at 85% 15%,#c9f65b28 0 1px,transparent 1.5px) 0 0/18px 18px}.top{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:bold}.bar{height:2px;background:var(--g);margin:24px 0}.bar i{display:block;height:100%;background:var(--l);width:0;transition:.35s}.s{flex:1;display:none;flex-direction:column;justify-content:center;max-width:900px;margin:auto;width:100%}.s.on{display:flex}.k{font-size:12px;color:var(--l);letter-spacing:.14em;text-transform:uppercase;font-weight:bold}.q{font-size:clamp(37px,6vw,76px);line-height:.9;letter-spacing:-.07em;text-transform:uppercase;margin:18px 0 28px}.x{border:1px solid var(--g);padding:17px;margin:7px 0;cursor:pointer;font-weight:bold;font-size:18px}.x:hover{background:var(--l);color:#111;border-color:var(--l)}button{margin-top:28px;align-self:flex-start;background:var(--l);color:#111;border:0;padding:13px 18px;font-weight:bold;cursor:pointer}textarea{width:100%;min-height:120px;background:#151515;color:var(--c);border:1px solid var(--g);padding:15px;font:inherit}</style><main class="p"><div class="top"><span>Sriti Jha</span><span id="n"></span></div><div class="bar"><i id="bar"></i></div><section id="s" class="s on"></section></main><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbxjCq6GHjoV1RrazD4NHI8x3yk_0zWrGqDQE7uvmRC3aEne19yaB2CHbrYw0D9TbO3n3A/exec',aud=[['craft','When Sriti talks about a role, what pulls you in?',['The character’s story','Behind-the-scenes details','The emotion of the moment','Her creative process']],['feeling','What kind of feeling brings you back?',['Comforted','Inspired','Entertained','Seen']],['format','What do you stop for most often?',['A quick reel','A thoughtful video','A photo carousel','A story update']],['action','When something really lands, what do you do?',['Like it','Send it to someone','Save it for later','Leave a comment']]],ideas=['Character afterthoughts','A role that changed me','One scene, three choices','What preparation looks like','The quiet before a shoot','Day on set, no filter','Notes I needed today','Small joys lately','A lesson from a hard week','Poem for a slow evening','Reading a follower’s line','Words that stayed with me','Get ready, tell a story','The meaning behind a look','Moodboard to moment','Answering thoughtful questions','Fan art spotlight','Shared comfort watchlist','A myth about acting','If this character had a diary','Crew appreciation reel','Tiny rituals between takes','What I am learning now','A letter to younger me','A poem with a story','Voice-note poetry','One item, three moods','Archive look revisit','Community question of the week','Thank-you milestone reel'],a={},step=-1,total=aud.length+ideas.length+2;function send(sheet,data){fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({sheet,...data,completed_at:new Date().toISOString()})})}function draw(){n.textContent=String(Math.min(step+1,total)).padStart(2,'0')+' / '+String(total).padStart(2,'0');bar.style.width=Math.min((step+1)/total*100,100)+'%';if(step<0){s.innerHTML='<span class="k">A few minutes</span><h1 class="q">Let’s make<br>something<br>you’ll love.</h1><button onclick="go()">Start</button>';return}if(step<aud.length){let q=aud[step];s.innerHTML='<span class="k">Your voice</span><h2 class="q">'+q[1]+'</h2>'+q[2].map(x=>'<div class="x" onclick="choose(\''+q[0]+'\',\''+x.replaceAll("'","\\'")+'\')">'+x+'</div>').join('');return}let k=step-aud.length;if(k<ideas.length){let x=ideas[k];s.innerHTML='<span class="k">Post idea '+(k+1)+' of 30</span><h2 class="q">'+x+'</h2><div class="x" onclick="choose(\''+k+'\',\'Must make\')">Must make</div><div class="x" onclick="choose(\''+k+'\',\'Interested\')">Interested</div><div class="x" onclick="choose(\''+k+'\',\'Maybe later\')">Maybe later</div><div class="x" onclick="choose(\''+k+'\',\'Skip\')">Skip</div>';return}if(k===ideas.length){s.innerHTML='<span class="k">Last question</span><h2 class="q">What would you love to see more of?</h2><textarea id="t" placeholder="Write whatever comes to mind…"></textarea><button onclick="finish()">Finish</button>';return}s.innerHTML='<span class="k">Thank you</span><h1 class="q" style="color:#c9f65b">Tag her<br>for more<br>content.</h1>'}function go(){step++;draw()}function choose(k,v){a[k]=v;if(step===aud.length-1)send('Audience Responses',{craft:a.craft,feeling:a.feeling,format:a.format,action:a.action});step++;draw()}function finish(){a.gap=t.value;send('Post Ideas Responses',{...a});step++;draw()}draw()</script>
